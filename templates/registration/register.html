{% extends "base.html" %}
{% block title %}Register - ShopEasy{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn full" type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
